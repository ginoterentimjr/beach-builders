const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSf8Q0eXHBOoqDjMB4RNrlT2vCchtRgfrl3rMNP-N9qK_XbWBw/formResponse";
const ENTRY = { nome: "entry.569173553", desafio: "entry.2095890421", acertos: "entry.240185722", respostas: "entry.597932716" };
const CFG = {"CH": {"4": [1, "O Portal das Águas"], "6": [2, "A Torre das Nuvens"], "9": [3, "A Fonte Cristalina"], "11": [4, "Como está a água?"], "13": [5, "O Mercado das Conchas"], "15": [6, "A Oficina das Lixeiras"], "17": [7, "O Vale dos Resíduos"]}, "NPAGES": 18, "KEY": "atlantis-geo-v1", "PER": 10, "CUR": "🦪", "PREFIX": "Geografia V1", "CHWORD": "Desafio", "MSG_OK": "🎉 {s} / {t}! Desafio {n} completo: +10 pérolas e um portal reaceso!<small>Conte ao papai uma coisa que você aprendeu nesta página.</small>", "MSG_TRY": "⭐ {s} / {t}. Muito bem! Veja os quadradinhos vermelhos, releia a página da missão e tente mais uma vez.<small>Você já ganhou a medalha do Desafio {n}. Cada tentativa faz o cérebro crescer!</small>", "CONFIRM": "Recomeçar e apagar todas as respostas deste aparelho?"};
const CH = CFG.CH;
const NPAGES = CFG.NPAGES, KEY = CFG.KEY, PER = CFG.PER, MAXC = Object.keys(CH).length * PER;
const W = DATA.W, H = DATA.H;
const F = DATA.fields.map((f, i) => ({ ...f, id: i }));

let st = { page: 1, on: {}, text: {}, done: {}, tries: {}, queue: [] };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };

const $ = (id) => document.getElementById(id);
const pageEl = $("page"), resEl = $("result");

function groupsOn(p) {
  const order = [], map = {};
  F.filter((f) => f.p === p && f.g).forEach((f) => { if (!map[f.g]) { map[f.g] = []; order.push(f.g); } map[f.g].push(f); });
  return order.map((g, i) => ({ g, n: i + 1, multi: g.endsWith("*"), items: map[g] }));
}

function render() {
  const p = st.page;
  pageEl.style.backgroundImage = `url(pages/p-${String(p).padStart(2, "0")}.jpg)`;
  pageEl.innerHTML = "";
  const pw = pageEl.clientWidth || 1000;
  F.filter((f) => f.p === p).forEach((f) => {
    const css = `left:${(f.x / W) * 100}%;top:${(f.y / H) * 100}%;width:${(f.w / W) * 100}%;height:${(f.h / H) * 100}%;`;
    if (f.t === "cb") {
      const d = document.createElement("div");
      d.className = "cb" + (st.on[f.id] ? " on" : "");
      d.style.cssText = css + `--fs:${Math.max(12, (f.h / H) * pw * 0.9 * (H / W) * (W / H))}px`;
      d.setAttribute("role", "checkbox"); d.setAttribute("aria-checked", !!st.on[f.id]);
      d.dataset.id = f.id;
      d.addEventListener("click", () => toggle(f));
      pageEl.appendChild(d);
    } else {
      const inp = document.createElement("input");
      inp.className = "tx"; inp.type = "text"; inp.maxLength = 24; inp.autocomplete = "off"; inp.spellcheck = false;
      inp.style.cssText = css + `font-size:${Math.max(13, (f.h / H) * pw * 0.62 * (W / H) / (W / H))}px`;
      inp.value = st.text[f.id] || "";
      inp.addEventListener("input", () => { st.text[f.id] = inp.value; save(); });
      pageEl.appendChild(inp);
    }
  });
  $("pageno").textContent = `${p} / ${NPAGES}`;
  $("prev").disabled = p === 1; $("next").disabled = p === NPAGES;
  $("check").style.display = $("check2").style.display = CH[p] ? "" : "none";
  $("prev2").disabled = p === 1; $("next2").disabled = p === NPAGES;
  resEl.className = "result"; resEl.innerHTML = "";
  if (CH[p] && st.done[p]) showResult(p, st.done[p].score, st.done[p].total, false);
  $("dots").innerHTML = "";
  for (let i = 1; i <= NPAGES; i++) {
    const b = document.createElement("button");
    b.className = "dot" + (i === p ? " cur" : "") + (CH[i] && st.done[i] ? " done" : "");
    b.textContent = i; b.setAttribute("aria-label", String(i));
    b.onclick = () => go(i);
    $("dots").appendChild(b);
  }
  $("shells").textContent = `${CFG.CUR} ${Object.keys(st.done).length * PER} / ${MAXC}`;
}

function toggle(f) {
  const turnOn = !st.on[f.id];
  if (turnOn && f.g && !f.g.endsWith("*")) F.filter((o) => o.g === f.g).forEach((o) => delete st.on[o.id]);
  if (turnOn) st.on[f.id] = 1; else delete st.on[f.id];
  save(); render();
}

function go(p) { st.page = Math.min(NPAGES, Math.max(1, p)); save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }

function showResult(p, score, total, fresh) {
  const [n, name] = CH[p];
  const perfect = score === total;
  resEl.className = "result show " + (perfect ? "good" : "try");
  resEl.innerHTML = perfect
    ? CFG.MSG_OK.replace(/\{s\}/g, score).replace(/\{t\}/g, total).replace(/\{n\}/g, n)
    : CFG.MSG_TRY.replace(/\{s\}/g, score).replace(/\{t\}/g, total).replace(/\{n\}/g, n);
  if (fresh) resEl.scrollIntoView({ behavior: "smooth", block: "center" });
}

function check() {
  const p = st.page; if (!CH[p]) return;
  const gs = groupsOn(p);
  let score = 0; const lines = [];
  gs.forEach(({ g, n, items }) => {
    const chosen = items.filter((f) => st.on[f.id]);
    const right = items.filter((f) => f.ok);
    const correct = chosen.length === right.length && chosen.every((f) => f.ok);
    if (correct) score++;
    items.forEach((f) => {
      const el = pageEl.querySelector(`[data-id="${f.id}"]`); if (!el) return;
      el.classList.remove("ok", "bad", "missing");
      if (st.on[f.id]) el.classList.add(f.ok ? "ok" : "bad");
    });
    if (!chosen.length) items.forEach((f) => { const el = pageEl.querySelector(`[data-id="${f.id}"]`); if (el) el.classList.add("missing"); });
    lines.push(`${n}: ${chosen.map((f) => f.label).join(" + ") || "(em branco)"} ${correct ? "✔" : "✘"}`);
  });
  const extra = F.filter((f) => f.p === p && f.t === "tx").map((f) => (st.text[f.id] || "").trim()).filter(Boolean);
  if (extra.length) lines.push(`frase: ${extra.join(" / ")}`);
  const total = gs.length;
  st.tries[p] = (st.tries[p] || 0) + 1;
  st.done[p] = { score, total };
  const stopBox = F.find((f) => f.p === 2 && f.stop === CH[p][0]); if (stopBox) st.on[stopBox.id] = 1;
  save();
  $("shells").textContent = `${CFG.CUR} ${Object.keys(st.done).length * PER} / ${MAXC}`;
  showResult(p, score, total, true);
  const nameField = F.find((f) => f.p === 1 && f.t === "tx");
  send({ nome: (st.text[nameField.id] || "Isabel").trim() || "Isabel", desafio: `${CFG.PREFIX} · ${CFG.CHWORD} ${CH[p][0]} · ${CH[p][1]} (página ${p})`,
    acertos: `${score}/${total} (tentativa ${st.tries[p]})`, respostas: lines.join(" | ") });
}

function send(rec) { st.queue.push(rec); save(); flush(); }
async function flush() {
  while (st.queue.length) {
    const rec = st.queue[0];
    const body = new URLSearchParams();
    Object.keys(ENTRY).forEach((k) => body.append(ENTRY[k], rec[k] || ""));
    try { await fetch(FORM, { method: "POST", mode: "no-cors", body }); st.queue.shift(); save(); }
    catch (e) { break; }
  }
}

$("prev").onclick = () => go(st.page - 1);
$("next").onclick = () => go(st.page + 1);
$("check").onclick = check;
$("prev2").onclick = () => go(st.page - 1);
$("next2").onclick = () => go(st.page + 1);
$("check2").onclick = check;
$("reset").onclick = (e) => { e.preventDefault(); if (confirm(CFG.CONFIRM)) { const q = st.queue; st = { page: 1, on: {}, text: {}, done: {}, tries: {}, queue: q }; save(); render(); } };
document.addEventListener("keydown", (e) => { if (e.target.tagName === "INPUT") return; if (e.key === "ArrowRight") go(st.page + 1); if (e.key === "ArrowLeft") go(st.page - 1); });
let sx = null;
pageEl.addEventListener("touchstart", (e) => { sx = e.touches[0].clientX; }, { passive: true });
pageEl.addEventListener("touchend", (e) => { if (sx === null) return; const dx = e.changedTouches[0].clientX - sx; if (Math.abs(dx) > 70) go(st.page + (dx < 0 ? 1 : -1)); sx = null; });
window.addEventListener("resize", render);
window.addEventListener("online", flush);
for (let i = 1; i <= NPAGES; i++) { const im = new Image(); im.src = `pages/p-${String(i).padStart(2, "0")}.jpg`; }
render(); flush();
</script>
