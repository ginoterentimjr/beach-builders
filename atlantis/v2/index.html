<title>Atlantis 2: As Profundezas</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9A%3C/text%3E%3C/svg%3E">
<style>
  :root { --sea:#1E6E9E; --sea2:#134B6E; --ink:#3A2A1A; --ok:#2f9e44; --bad:#e03131; --bg:#FFF8EC; --orange:#E07E1E; --card:#FFFFFF; --muted:#7A6A57; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", system-ui, sans-serif; }
  body { background: linear-gradient(#CDEBF7 0, #FFF8EC 320px); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--sea); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header .title { font-weight: 700; font-size: 17px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  header .shells { font-weight: 700; font-size: 16px; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  main { max-width: 1020px; margin: 0 auto; padding: 14px 14px 40px; }
  h1 { font-size: 30px; margin: 6px 0 4px; color: var(--sea); text-align: center; }
  h2 { font-size: 24px; margin: 4px 0 8px; color: var(--sea2); }
  h3 { color: var(--sea2); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 14px; font-size: 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 3px 12px rgba(0,0,0,.08); margin: 12px 0; font-size: 17px; }
  .remember { background: #FFF3D6; border: 3px solid #F2C94C; }
  .remember b { color: var(--orange); }
  .act { display: flex; gap: 12px; align-items: center; background: #E6F4EA; border: 3px solid #5BA84F; }
  .act .tag { font-weight: 900; color: #3F7A36; white-space: nowrap; }
  .guide { width: 74px; flex: none; }
  .hint { margin: 0 0 10px; font-size: 16px; text-align: center; color: var(--muted); }
  button { font-family: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; min-height: 48px; touch-action: manipulation; }
  .btn { background: var(--sea); color: #fff; box-shadow: 0 3px 0 var(--sea2); }
  .btn.orange { background: var(--orange); box-shadow: 0 3px 0 #a85a10; }
  .btn.ghost { background: #fff; color: var(--sea); border: 3px solid var(--sea); box-shadow: none; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .feedback { display: none; text-align: center; border-radius: 16px; padding: 12px 14px; font-size: 18px; font-weight: 700; margin-top: 10px; }
  .feedback.show { display: block; }
  .feedback.good { background: #E6F4EA; border: 3px solid var(--ok); }
  .feedback.try { background: #FFF3D6; border: 3px solid var(--orange); }
  .feedback small { display: block; font-weight: 400; font-size: 15px; margin-top: 4px; }
  .why { text-align: left; font-weight: 400; font-size: 15px; margin-top: 8px; background: #fff; border-radius: 12px; padding: 10px 12px; }
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 3px solid #C9B79A; border-radius: 14px; padding: 10px 14px; font-size: 17px; font-weight: 700; min-height: 52px; cursor: pointer; user-select: none; text-align: center; }
  .chip img { height: 34px; }
  .chip.sel { border-color: var(--orange); background: #FFF3D6; transform: scale(1.04); }
  .chip.ok { border-color: var(--ok); background: #E6F4EA; }
  .chip.bad { border-color: var(--bad); background: #FDE4DE; }
  .chip.reveal { outline: 4px dashed var(--ok); outline-offset: 2px; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 60px; padding: 8px; }
  .bins { display: grid; grid-template-columns: repeat(var(--nb, 2), 1fr); gap: 12px; }
  .bin { border-radius: 18px; padding: 10px; min-height: 150px; border: 4px dashed; }
  .bin h3 { margin: 0 0 8px; text-align: center; font-size: 19px; cursor: pointer; }
  .bin .pool { min-height: 80px; }
  .bin.target { box-shadow: 0 0 0 4px #F2C94C; }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .match .col { display: flex; flex-direction: column; gap: 10px; }
  .match .chip { justify-content: flex-start; text-align: left; position: relative; padding-left: 46px; }
  .match .num { position: absolute; left: 10px; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 15px; display: none; align-items: center; justify-content: center; }
  .match .paired .num { display: flex; }
  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .pic { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); text-align: center; }
  .pic img { height: 90px; max-width: 100%; object-fit: contain; }
  .pic .q { font-size: 16px; margin: 4px 0 8px; }
  .pic .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pic .chip { font-size: 15px; padding: 6px 6px; min-height: 44px; border-radius: 12px; }
  .tf { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 17px; flex-wrap: wrap; }
  .tf:last-child { border-bottom: 0; }
  .tf .two { display: flex; gap: 8px; flex: none; flex-wrap: wrap; }
  .tf .chip { min-width: 84px; }
  .gap { display: inline-flex; min-width: 120px; min-height: 46px; border: 3px dashed var(--sea); border-radius: 12px; align-items: center; justify-content: center; padding: 4px 10px; margin: 0 4px; cursor: pointer; background: #fff; vertical-align: middle; font-weight: 700; color: var(--sea2); }
  .gap.ok { border: 3px solid var(--ok); background: #E6F4EA; } .gap.bad { border: 3px solid var(--bad); background: #FDE4DE; }
  .gap.sel { border-color: var(--orange); background: #FFF3D6; }
  .sentence { font-size: 19px; line-height: 2.2; margin: 6px 0; }
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mcard { aspect-ratio: 4 / 3; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; cursor: pointer; font-weight: 700; font-size: 16px; user-select: none; background: var(--sea); color: #fff; box-shadow: 0 3px 0 var(--sea2); }
  .mcard.up { background: #fff; color: var(--ink); border: 3px solid var(--sea); box-shadow: none; }
  .mcard.done { background: #E6F4EA; color: #2f6a26; border: 3px solid var(--ok); box-shadow: none; }
  .mcard .back { font-size: 30px; }
  .build { min-height: 60px; border: 3px dashed #C9B79A; border-radius: 14px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #FFFDF7; }
  .build.ok { border: 3px solid var(--ok); background: #E6F4EA; } .build.bad { border: 3px solid var(--bad); background: #FDE4DE; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .tile { background: #fff; border: 3px solid var(--sea); color: var(--sea2); border-radius: 12px; padding: 8px 12px; font-size: 17px; font-weight: 700; cursor: pointer; min-height: 46px; display: inline-flex; align-items: center; gap: 6px; }
  .tile img { height: 30px; }
  .tile.used { visibility: hidden; }
  .map { display: grid; grid-template-columns: repeat(var(--nm, 3), 1fr); gap: 12px; }
  .stop { background: #fff; border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,.08); cursor: pointer; border: 3px solid transparent; }
  .stop img { height: 70px; }
  .stop .n { font-size: 14px; color: var(--muted); }
  .stop .nm { font-weight: 700; font-size: 17px; }
  .stop .st { font-size: 14px; margin-top: 4px; }
  .stop.done { border-color: var(--ok); background: #F3FBF4; }
  .team { display: flex; justify-content: center; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
  .team img { height: 90px; }
  .name { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 700; }
  .name input { font-family: inherit; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 3px solid var(--sea); width: 220px; color: var(--sea2); font-weight: 700; }
  .cert { text-align: center; border: 6px solid #F2A93B; background: #FFFCF4; }
  /* frações e moedas (Math) */
  .shade { display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; }
  .shade .it { background: #fff; border-radius: 16px; padding: 10px 12px; box-shadow: 0 2px 8px rgba(0,0,0,.07); text-align: center; }
  .shade .q { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
  .bar { display: flex; height: 54px; border: 3px solid #3A2A1A; border-radius: 6px; overflow: hidden; width: 300px; max-width: 80vw; margin: 0 auto; }
  .bar div { flex: 1; border-right: 2px solid #3A2A1A; background: #fff; cursor: pointer; }
  .bar div:last-child { border-right: 0; }
  .bar div.on { background: var(--fill, #F2A93B); }
  .setg { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 320px; margin: 0 auto; }
  .setg span { width: 44px; height: 44px; border-radius: 50%; border: 3px solid #3A2A1A; background: #fff; cursor: pointer; }
  .setg span.on { background: var(--fill, #F2A93B); }
  .it.ok { outline: 4px solid var(--ok); } .it.bad { outline: 4px solid var(--bad); }
  .coins { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 8px 0; }
  .coin { width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; cursor: pointer; border: 4px solid #8a6400; background: #F2C94C; color: #5a3a00; box-shadow: 0 3px 0 #8a6400; user-select: none; text-align: center; line-height: 1.05; }
  .coin.silver { background: #D5DCE2; border-color: #6A7480; color: #2B3A4A; box-shadow: 0 3px 0 #6A7480; }
  .coin.copper { background: #D9915A; border-color: #7a3a1a; color: #3a1a0a; box-shadow: 0 3px 0 #7a3a1a; }
  .coin.bi { background: radial-gradient(#F2C94C 0 52%, #D5DCE2 53%); border-color: #6A7480; }
  .coin.note { width: 110px; height: 60px; border-radius: 10px; background: #BFE3A8; border-color: #3F7A36; color: #1F4A1A; box-shadow: 0 3px 0 #3F7A36; }
  .tray { min-height: 86px; border: 3px dashed #C9B79A; border-radius: 16px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; background: #FFFDF7; }
  .tray .coin { width: 56px; height: 56px; font-size: 13px; }
  .tray .coin.note { width: 90px; height: 50px; }
  .tray.ok { border: 3px solid var(--ok); background: #E6F4EA; } .tray.bad { border: 3px solid var(--bad); background: #FDE4DE; }
  .total { text-align: center; font-weight: 700; font-size: 18px; margin: 6px 0; }
  .hp { height: 22px; border: 3px solid #3A2A1A; border-radius: 12px; overflow: hidden; display: flex; max-width: 380px; margin: 6px auto; background: #fff; }
  .hp div { flex: 1; border-right: 1px solid #3A2A1A; }
  .hp div:last-child { border-right: 0; }
  .hp div.on { background: #EE6C4D; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 12px 24px; }
  footer a { color: var(--muted); }
  @media (max-width: 640px) { .map { grid-template-columns: repeat(2, 1fr); } .bins { grid-template-columns: 1fr 1fr; } .match { grid-template-columns: 1fr; } .mem { grid-template-columns: repeat(3, 1fr); } h1 { font-size: 24px; } .guide { width: 56px; } }
</style>

  pics(r, box) {
    const a = A(r); a.pic = a.pic || {}; a.tf = a.tf || {};
    box.innerHTML = `${r.pics && r.pics.length ? `<div class="pics"></div>` : ""}${r.tf && r.tf.length ? `<h3 style="margin:16px 0 6px">${r.tfTitle || T.tfTitle}</h3><div id="tf"></div>` : ""}`;
    const grid = box.querySelector(".pics"), tfb = box.querySelector("#tf"); const groups = [];
    (r.pics || []).forEach((p, i) => {
      const c = el(`<div class="pic">${p[0] ? `<img src="${img(p[0])}" alt="">` : ""}<div class="q">${i + 1}. ${p[1]}</div><div class="opts"></div></div>`);
      const opts = p[2].map((s) => { const b = el(`<div class="chip">${s}</div>`); b.onclick = () => { a.pic[i] = s; save(); paint(); }; c.querySelector(".opts").appendChild(b); return b; });
      grid.appendChild(c); groups.push({ store: a.pic, i, opts, labels: p[2], right: p[3], q: p[1] });
    });
    (r.tf || []).forEach((t, i) => {
      const row = el(`<div class="tf"><span>${(r.pics || []).length + i + 1}. ${t[0]}</span><span class="two"></span></div>`);
      const opts = t[1].map((s) => { const b = el(`<div class="chip">${s}</div>`); b.onclick = () => { a.tf[i] = s; save(); paint(); }; row.querySelector(".two").appendChild(b); return b; });
      tfb.appendChild(row); groups.push({ store: a.tf, i, opts, labels: t[1], right: t[2], q: t[0] });
    });
    function paint() { groups.forEach((g) => g.opts.forEach((b, o) => { b.classList.remove("ok", "bad", "reveal"); b.classList.toggle("sel", g.store[g.i] === g.labels[o]); })); }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      groups.forEach((g) => { const v = g.store[g.i], ok = v === g.right; if (ok) score++;
        g.opts.forEach((b, o) => { const val = g.labels[o]; b.classList.remove("ok", "bad", "reveal", "sel"); if (val === v) b.classList.add(ok ? "ok" : "bad"); if (reveal && !ok && val === g.right) b.classList.add("reveal"); });
        lines.push(`${g.q.replace(/<[^>]+>/g, "")} ${v === undefined ? "(sem resposta)" : v} ${ok ? "✔" : "✘"}`); });
      return { score, total: groups.length, lines };
    } };
  },
  // completar lacunas: r.gaps = [[antes, certa, depois]], r.bank = [palavras]
  gaps(r, box) {
    const a = A(r); a.gap = a.gap || {};
    box.innerHTML = `<p class="hint">${T.gapHint}</p><div class="tiles" id="bank"></div><div id="sent"></div>`;
    let selW = null; const bank = box.querySelector("#bank"), sent = box.querySelector("#sent");
    const tiles = shuffle(r.bank, 5).map((w) => { const t = el(`<div class="tile">${w}</div>`); t.dataset.w = w; t.onclick = () => { selW = selW === w ? null : w; paint(); }; bank.appendChild(t); return t; });
    const gaps = r.gaps.map((g, i) => { const row = el(`<div class="sentence">${i + 1}. ${g[0]} <span class="gap"></span>${g[2]}</div>`); const gp = row.querySelector(".gap");
      gp.onclick = () => { if (selW) { Object.keys(a.gap).forEach((k) => { if (a.gap[k] === selW) delete a.gap[k]; }); a.gap[i] = selW; selW = null; } else delete a.gap[i]; save(); paint(); };
      sent.appendChild(row); return gp; });
    function paint() {
      const used = Object.values(a.gap);
      tiles.forEach((t) => { t.classList.toggle("used", used.includes(t.dataset.w)); t.style.background = selW === t.dataset.w ? "#FFF3D6" : ""; t.style.borderColor = selW === t.dataset.w ? "#E07E1E" : ""; });
      gaps.forEach((gp, i) => { gp.classList.remove("ok", "bad"); gp.textContent = a.gap[i] || T.tapHere; gp.style.color = a.gap[i] ? "" : "#9ab"; gp.classList.toggle("sel", !!selW && !a.gap[i]); });
    }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      gaps.forEach((gp, i) => { const v = a.gap[i], ok = v === r.gaps[i][1]; if (ok) score++; gp.classList.remove("sel"); gp.classList.add(ok ? "ok" : "bad");
        if (reveal && !ok) gp.textContent = `${v || "?"} → ${r.gaps[i][1]}`;
        lines.push(`${i + 1}: ${v || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.gaps.length, lines };
    } };
  },
  // jogo da memória + perguntas rápidas: r.mem = [[a, b]], r.quick = [[pergunta, [opções], certa]]
  memory(r, box) {
    const a = A(r); a.found = a.found || []; a.q = a.q || {}; a.moves = a.moves || 0;
    const cards = shuffle(r.mem.flatMap((p, i) => [[i, p[0], true], [i, p[1], false]]), 3);
    box.innerHTML = `<p class="hint">${T.memHint}</p><div class="mem"></div><p id="mv" style="text-align:center;font-weight:700;margin:10px 0 0"></p><h3 style="margin:16px 0 6px">${r.quickTitle || T.quickTitle}</h3><div id="qk"></div>`;
    const grid = box.querySelector(".mem"); let up = [], lock = false;
    const els = cards.map((c, k) => { const d = el(`<div class="mcard"><span class="back">${CFG.CUR}</span></div>`); d.onclick = () => flip(k); grid.appendChild(d); return d; });
    function paint() {
      els.forEach((d, k) => { const [i, t, isP] = cards[k]; const done = a.found.includes(i), isUp = up.includes(k);
        d.className = "mcard" + (done ? " done" : isUp ? " up" : ""); d.innerHTML = done || isUp ? (isP ? `<span style="font-size:19px">${t.toUpperCase()}</span>` : t) : `<span class="back">${CFG.CUR}</span>`; });
      box.querySelector("#mv").textContent = fmt(T.pairs, { f: a.found.length, n: r.mem.length, m: a.moves });
    }
    function flip(k) {
      if (lock || up.includes(k) || a.found.includes(cards[k][0])) return;
      up.push(k); paint();
      if (up.length === 2) { a.moves++; const [x, y] = up;
        if (cards[x][0] === cards[y][0]) { a.found.push(cards[x][0]); up = []; save(); setTimeout(paint, 250); }
        else { lock = true; setTimeout(() => { up = []; lock = false; paint(); }, 1100); } save(); }
    }
    const qk = box.querySelector("#qk"); const groups = [];
    r.quick.forEach((q, i) => { const row = el(`<div class="tf"><span>${i + 1}. ${q[0]}</span><span class="two"></span></div>`);
      const opts = q[1].map((o) => { const b = el(`<div class="chip">${o}</div>`); b.onclick = () => { a.q[i] = o; save(); pq(); }; row.querySelector(".two").appendChild(b); return b; });
      qk.appendChild(row); groups.push(opts); });
    function pq() { r.quick.forEach((q, i) => groups[i].forEach((b, o) => { b.classList.remove("ok", "bad", "reveal"); b.classList.toggle("sel", a.q[i] === q[1][o]); })); }
    paint(); pq();
    return { check(reveal) {
      let score = a.found.length; const lines = [`memória: ${a.found.length}/${r.mem.length} pares em ${a.moves} jogadas`];
      if (a.found.length < r.mem.length) els.forEach((d, k) => { if (!a.found.includes(cards[k][0])) d.style.outline = "3px dashed #e03131"; });
      r.quick.forEach((q, i) => { const v = a.q[i], ok = v === q[2]; if (ok) score++;
        groups[i].forEach((b, o) => { b.classList.remove("ok", "bad", "reveal", "sel"); if (q[1][o] === v) b.classList.add(ok ? "ok" : "bad"); if (reveal && !ok && q[1][o] === q[2]) b.classList.add("reveal"); });
        lines.push(`${q[0]} ${v || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.mem.length + r.quick.length, lines };
    } };
  },
  // pôr em ordem: r.sentences = [[peça1, peça2, ...]] (cada lista na ordem certa), r.labels = títulos
  build(r, box) {
    const a = A(r); a.b = a.b || {};
    box.innerHTML = `<p class="hint">${T.buildHint}</p><div id="ss"></div>`;
    const ss = box.querySelector("#ss"); const parts = [];
    r.sentences.forEach((sen, i) => {
      a.b[i] = a.b[i] || [];
      const wrap = el(`<div style="margin:0 0 16px"><div style="font-weight:700;margin-bottom:6px">${(r.labels && r.labels[i]) || fmt(T.sentWord, { n: i + 1 })}</div><div class="build"></div><div class="tiles"></div></div>`);
      const bd = wrap.querySelector(".build"), tl = wrap.querySelector(".tiles");
      const order = shuffle(sen.map((_, k) => k), 13 + i * 7);
      const tiles = order.map((k) => { const t = el(`<div class="tile">${sen[k]}</div>`); t.onclick = () => { if (!a.b[i].includes(k)) { a.b[i].push(k); save(); paint(); } }; tl.appendChild(t); t.dataset.k = k; return t; });
      function paint() {
        bd.classList.remove("ok", "bad"); bd.innerHTML = a.b[i].length ? "" : `<span style="color:#9ab">${T.tapPieces}</span>`;
        a.b[i].forEach((k, pos) => { const t = el(`<div class="tile" style="border-color:#E07E1E">${r.numbered ? pos + 1 + ". " : ""}${sen[k]}</div>`); t.onclick = () => { a.b[i].splice(pos, 1); save(); paint(); }; bd.appendChild(t); });
        tiles.forEach((t) => t.classList.toggle("used", a.b[i].includes(+t.dataset.k)));
      }
      paint(); parts.push({ bd, sen, wrap }); ss.appendChild(wrap);
    });
    return { check(reveal) {
      let score = 0; const lines = [];
      parts.forEach((p, i) => { const ok = a.b[i].length === p.sen.length && a.b[i].every((k, pos) => k === pos); if (ok) score++;
        p.bd.classList.add(ok ? "ok" : "bad");
        const old = p.wrap.querySelector(".reveal-line"); if (old) old.remove();
        if (reveal && !ok) p.wrap.appendChild(el(`<div class="reveal-line" style="margin-top:6px;color:#2f6a26;font-weight:700">✔ ${p.sen.join(r.joiner || " ")}</div>`));
        lines.push(`${i + 1}: ${a.b[i].map((k) => p.sen[k]).join(" / ") || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.sentences.length, lines };
    } };
  },
  // pintar frações: r.shade = [[pergunta, "bar"|"set", partes, certas, cor?]]
  shade(r, box) {
    const a = A(r); a.on = a.on || {};
    box.innerHTML = `<p class="hint">${T.shadeHint}</p><div class="shade"></div>`;
    const wrap = box.querySelector(".shade"); const items = [];
    r.shade.forEach((q, i) => {
      a.on[i] = a.on[i] || [];
      const it = el(`<div class="it"><div class="q">${i + 1}. ${q[0]}</div><div class="${q[1] === "bar" ? "bar" : "setg"}" style="--fill:${q[4] || "#F2A93B"}"></div><div class="total" style="font-size:15px"></div></div>`);
      const g = it.querySelector(".bar,.setg");
      const parts = [...Array(q[2])].map((_, k) => { const p = el(q[1] === "bar" ? `<div></div>` : `<span></span>`); p.onclick = () => { const s = a.on[i]; const at = s.indexOf(k); if (at >= 0) s.splice(at, 1); else s.push(k); save(); paint(); }; g.appendChild(p); return p; });
      wrap.appendChild(it); items.push({ it, parts, q, cnt: it.querySelector(".total") });
    });
    function paint() { items.forEach(({ it, parts, q, cnt }, i) => { it.classList.remove("ok", "bad"); parts.forEach((p, k) => p.classList.toggle("on", a.on[i].includes(k))); cnt.textContent = fmt(T.shadeCount, { n: a.on[i].length, d: q[2] }); }); }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      items.forEach(({ it, q, cnt }, i) => { const n = a.on[i].length, ok = n === q[3]; if (ok) score++; it.classList.add(ok ? "ok" : "bad");
        if (reveal && !ok) cnt.textContent = fmt(T.shadeReveal, { r: q[3], d: q[2] });
        lines.push(`${q[0].replace(/<[^>]+>/g, "")}: ${n}/${q[2]} ${ok ? "✔" : "✘"}`); });
      return { score, total: items.length, lines };
    } };
  },
  // moedas: r.coins = [[valor em centavos, rótulo, classe]], r.tasks = [[enunciado, alvo em centavos]]
  coins(r, box) {
    const a = A(r); a.t = a.t || {};
    const money = (c) => "R$ " + (c / 100).toFixed(2).replace(".", ",");
    box.innerHTML = `<p class="hint">${T.coinHint}</p><div id="tasks"></div>`;
    const wrap = box.querySelector("#tasks"); const items = [];
    r.tasks.forEach((tk, i) => {
      a.t[i] = a.t[i] || [];
      const it = el(`<div style="margin:0 0 18px"><div style="font-weight:700;font-size:18px;margin-bottom:6px">${i + 1}. ${tk[0]}</div><div class="coins"></div><div class="tray"></div><div class="total"></div></div>`);
      const cs = it.querySelector(".coins"), tray = it.querySelector(".tray"), tot = it.querySelector(".total");
      r.coins.forEach((c, k) => { const b = el(`<div class="coin ${c[2] || ""}">${c[1]}</div>`); b.onclick = () => { a.t[i].push(k); save(); paint(); }; cs.appendChild(b); });
      wrap.appendChild(it); items.push({ tray, tot, tk });
    });
    function paint() {
      items.forEach(({ tray, tot }, i) => { tray.classList.remove("ok", "bad"); tray.innerHTML = a.t[i].length ? "" : `<span style="color:#9ab">${T.trayEmpty}</span>`;
        a.t[i].forEach((k, pos) => { const c = r.coins[k]; const b = el(`<div class="coin ${c[2] || ""}">${c[1]}</div>`); b.onclick = () => { a.t[i].splice(pos, 1); save(); paint(); }; tray.appendChild(b); });
        tot.textContent = fmt(T.trayTotal, { v: money(a.t[i].reduce((s, k) => s + r.coins[k][0], 0)) }); });
    }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      items.forEach(({ tray, tot, tk }, i) => { const v = a.t[i].reduce((s, k) => s + r.coins[k][0], 0), ok = v === tk[1]; if (ok) score++; tray.classList.add(ok ? "ok" : "bad");
        if (reveal && !ok) tot.textContent = fmt(T.trayReveal, { v: money(v), r: money(tk[1]) });
        lines.push(`${tk[0].replace(/<[^>]+>/g, "")} ${money(v)} ${ok ? "✔" : "✘"}`); });
      return { score, total: items.length, lines };
    } };
  },
};

function send(rec) { queue.push(rec); saveQ(); flush(); }
async function flush() {
  while (queue.length) {
    const rec = queue[0]; const body = new URLSearchParams();
    Object.keys(ENTRY).forEach((k) => body.append(ENTRY[k], rec[k] || ""));
    try { await fetch(FORM, { method: "POST", mode: "no-cors", body }); queue.shift(); saveQ(); } catch (e) { break; }
  }
}
document.getElementById("foot").textContent = T.footer;
document.getElementById("reset").textContent = T.reset;
document.getElementById("home").onclick = () => go("home");
document.getElementById("reset").onclick = (e) => { e.preventDefault(); if (confirm(T.confirm)) { st = { screen: "home", name: st.name, res: {}, a: {} }; save(); render(); } };
window.addEventListener("online", flush);
render(); flush();
</script>
