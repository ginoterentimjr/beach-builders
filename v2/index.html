<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Beach Builders 2 · Ceará Coast Trip</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%85%3C/text%3E%3C/svg%3E">
<style>
  :root { --sea:#2E86B0; --sea2:#1D5F86; --sand:#F6E7C1; --ink:#3A2A1A; --ok:#2f9e44; --bad:#e03131; --bg:#FFF8EC; --orange:#E07E1E; --card:#FFFFFF; --muted:#7A6A57; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Comic Sans MS", "Comic Neue", "Chalkboard SE", system-ui, sans-serif; }
  body { background: linear-gradient(#DDF0FA 0, #FFF8EC 320px); min-height: 100vh; }
  header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--sea); color: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  header .title { font-weight: 700; font-size: 17px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; }
  header .shells { font-weight: 700; font-size: 16px; background: rgba(255,255,255,.18); padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
  main { max-width: 1020px; margin: 0 auto; padding: 14px 14px 40px; }
  h1 { font-size: 30px; margin: 6px 0 4px; color: var(--sea); text-align: center; }
  h2 { font-size: 24px; margin: 4px 0 8px; color: var(--sea2); }
  .sub { text-align: center; color: var(--muted); margin: 0 0 14px; font-size: 16px; }
  .card { background: var(--card); border-radius: 18px; padding: 14px 16px; box-shadow: 0 3px 12px rgba(0,0,0,.08); margin: 12px 0; }
  .remember { background: #FFF3D6; border: 3px solid #F2C94C; }
  .remember b { color: var(--orange); }
  .act { display: flex; gap: 12px; align-items: center; background: #E6F4EA; border: 3px solid #5BA84F; }
  .act .tag { font-weight: 900; color: #3F7A36; white-space: nowrap; }
  .guide { width: 74px; flex: none; }
  .row { display: flex; gap: 12px; align-items: center; }
  button { font-family: inherit; font-size: 17px; font-weight: 700; border: 0; border-radius: 14px; padding: 12px 18px; cursor: pointer; min-height: 48px; touch-action: manipulation; }
  .btn { background: var(--sea); color: #fff; box-shadow: 0 3px 0 var(--sea2); }
  .btn.orange { background: var(--orange); box-shadow: 0 3px 0 #a85a10; }
  .btn.ghost { background: #fff; color: var(--sea); border: 3px solid var(--sea); box-shadow: none; }
  .btn:disabled { opacity: .4; cursor: default; }
  .actions { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 14px 0 4px; }
  .feedback { display: none; text-align: center; border-radius: 16px; padding: 12px 14px; font-size: 18px; font-weight: 700; margin-top: 10px; }
  .feedback.show { display: block; }
  .feedback.good { background: #E6F4EA; border: 3px solid var(--ok); }
  .feedback.try { background: #FFF3D6; border: 3px solid var(--orange); }
  .feedback small { display: block; font-weight: 400; font-size: 15px; margin-top: 4px; }
  .why { text-align: left; font-weight: 400; font-size: 15px; margin-top: 8px; background: #fff; border-radius: 12px; padding: 10px 12px; }
  /* chips and states */
  .chip { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 3px solid #C9B79A; border-radius: 14px; padding: 10px 14px; font-size: 17px; font-weight: 700; min-height: 52px; cursor: pointer; user-select: none; text-align: center; }
  .chip img { height: 34px; }
  .chip.sel { border-color: var(--orange); background: #FFF3D6; transform: scale(1.04); }
  .chip.ok { border-color: var(--ok); background: #E6F4EA; }
  .chip.bad { border-color: var(--bad); background: #FDE4DE; }
  .chip.reveal { outline: 4px dashed var(--ok); outline-offset: 2px; }
  .pool { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; min-height: 60px; padding: 8px; }
  .bins { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .bin { border-radius: 18px; padding: 10px; min-height: 170px; border: 4px dashed; }
  .bin h3 { margin: 0 0 8px; text-align: center; font-size: 20px; }
  .bin .pool { min-height: 90px; }
  .bin.nat { border-color: #5BA84F; background: #EAF8DF; }
  .bin.con { border-color: var(--sea); background: #E3F4FC; }
  .bin.target { box-shadow: 0 0 0 4px #F2C94C; }
  .match { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; }
  .match .col { display: flex; flex-direction: column; gap: 10px; }
  .match .chip { justify-content: flex-start; text-align: left; position: relative; padding-left: 46px; }
  .match .num { position: absolute; left: 10px; width: 28px; height: 28px; border-radius: 50%; color: #fff; font-size: 15px; display: none; align-items: center; justify-content: center; }
  .match .paired .num { display: flex; }
  .pics { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .pic { background: #fff; border-radius: 16px; padding: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.07); text-align: center; }
  .pic img { height: 90px; max-width: 100%; object-fit: contain; }
  .pic .q { font-size: 15px; margin: 4px 0 8px; }
  .pic .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .pic .chip { font-size: 14px; padding: 6px 6px; min-height: 44px; border-radius: 12px; }
  .tf { display: flex; align-items: center; gap: 10px; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #eee; font-size: 17px; }
  .tf:last-child { border-bottom: 0; }
  .tf .two { display: flex; gap: 8px; flex: none; }
  .tf .chip { min-width: 84px; }
  .frame { display: flex; gap: 18px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .frame svg { width: 220px; height: 220px; background: #FFFDF7; border-radius: 16px; border: 3px solid #E6D8C3; }
  #sq { transition: transform .6s cubic-bezier(.3,1.6,.5,1); transform-origin: 110px 190px; }
  .gap { display: inline-flex; min-width: 120px; min-height: 46px; border: 3px dashed var(--sea); border-radius: 12px; align-items: center; justify-content: center; padding: 4px 10px; margin: 0 4px; cursor: pointer; background: #fff; vertical-align: middle; font-weight: 700; color: var(--sea2); }
  .gap.ok { border: 3px solid var(--ok); background: #E6F4EA; } .gap.bad { border: 3px solid var(--bad); background: #FDE4DE; }
  .gap.sel { border-color: var(--orange); background: #FFF3D6; }
  .sentence { font-size: 19px; line-height: 2.2; margin: 6px 0; }
  .mem { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .mcard { aspect-ratio: 4 / 3; border-radius: 16px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 6px; cursor: pointer; font-weight: 700; font-size: 16px; user-select: none; background: var(--sea); color: #fff; box-shadow: 0 3px 0 var(--sea2); }
  .mcard.up { background: #fff; color: var(--ink); border: 3px solid var(--sea); box-shadow: none; }
  .mcard.done { background: #E6F4EA; color: #2f6a26; border: 3px solid var(--ok); box-shadow: none; }
  .mcard .back { font-size: 30px; }
  .build { min-height: 60px; border: 3px dashed #C9B79A; border-radius: 14px; padding: 8px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; background: #FFFDF7; }
  .build.ok { border: 3px solid var(--ok); background: #E6F4EA; } .build.bad { border: 3px solid var(--bad); background: #FDE4DE; }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
  .tile { background: #fff; border: 3px solid var(--sea); color: var(--sea2); border-radius: 12px; padding: 8px 12px; font-size: 17px; font-weight: 700; cursor: pointer; min-height: 46px; display: inline-flex; align-items: center; }
  .tile.used { visibility: hidden; }
  .map { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .stop { background: #fff; border-radius: 18px; padding: 12px 10px; text-align: center; box-shadow: 0 3px 12px rgba(0,0,0,.08); cursor: pointer; border: 3px solid transparent; }
  .stop img { height: 70px; }
  .stop .n { font-size: 14px; color: var(--muted); }
  .stop .nm { font-weight: 700; font-size: 17px; }
  .stop .st { font-size: 14px; margin-top: 4px; }
  .stop.done { border-color: var(--ok); background: #F3FBF4; }
  .team { display: flex; justify-content: center; gap: 10px; align-items: flex-end; }
  .team img { height: 90px; }
  .name { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; font-weight: 700; }
  .name input { font-family: inherit; font-size: 18px; padding: 10px 12px; border-radius: 12px; border: 3px solid var(--sea); width: 220px; color: var(--sea2); font-weight: 700; }
  .cert { text-align: center; border: 6px solid #F2A93B; background: #FFFCF4; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 6px 12px 24px; }
  footer a { color: var(--muted); }
  @media (max-width: 640px) { .map { grid-template-columns: repeat(2, 1fr); } .bins, .match { grid-template-columns: 1fr; } .mem { grid-template-columns: repeat(3, 1fr); } h1 { font-size: 24px; } .guide { width: 56px; } }
</style>
</head>
<body>
<header>
  <div class="title" id="home">🌅 Beach Builders 2 · Ceará Coast Trip</div>
  <div class="shells" id="shells">🐚 0 / 60</div>
</header>
<main id="app"></main>
<footer>Your answers are saved on this device and sent to Dad. · <a href="#" id="reset">start over</a></footer>
<script>
const FORM = "https://docs.google.com/forms/d/e/1FAIpQLSf8Q0eXHBOoqDjMB4RNrlT2vCchtRgfrl3rMNP-N9qK_XbWBw/formResponse";
const ENTRY = { nome: "entry.569173553", desafio: "entry.2095890421", acertos: "entry.240185722", respostas: "entry.597932716" };
const KEY = "beach-builders-v2";
const img = (n) => `img/${n}.png`;

/* ===================== ROUNDS ===================== */
const ROUNDS = [
  { id: 1, stop: "Canoa Quebrada", pic: "duna", guide: "sky", title: "Sort the Beach!",
    remember: "<b>A structure</b> is a solid object that holds weight or load. It has a size, a shape and a function. <b>Natural</b> structures are made by nature or by animals. <b>Constructed</b> structures are built by people.",
    action: ["MOVE!", "Before each card, do the move: NATURAL = wave your arms like coconut leaves; CONSTRUCTED = stack your fists like a tower."],
    type: "sort",
    items: [["termite mound", "N"], ["tent", "C"], ["your skeleton", "N"], ["Eiffel Tower", "C"], ["mountain", "N"], ["playground", "C"], ["honeycomb", "N"], ["jangada", "C"], ["coconut tree", "N"], ["skyscraper", "C"]],
    why: "Nature and animals build natural structures: termite mounds, honeycombs, trees, mountains, even your skeleton holds up your body! People build constructed structures: tents, towers, playgrounds, boats and skyscrapers." },
  { id: 2, stop: "Morro Branco", pic: "ninho", guide: "nina", title: "What Is It For?",
    remember: "Every structure has a <b>function</b>: its job. Natural structures give <b>shelter</b>, help animals <b>find food</b> or give <b>protection</b>. Constructed structures have jobs too!",
    action: ["TALK!", "For each pair, say it out loud to Dad: \"A ___ is for ___.\""],
    type: "match",
    pairs: [["bird nest", "protects eggs and baby birds"], ["spider web", "catches insects for food"], ["turtle shell", "protects the turtle from danger"], ["beaver lodge", "a home above the water"],
      ["wasp nest", "protects wasps from danger"], ["bridge", "helps people cross over water"], ["roof", "protects a house from rain and sun"], ["chair", "gives you a place to sit"]],
    why: "SHELTER is a home (nest, lodge, burrow, beehive). PROTECTION keeps an animal safe from danger (turtle shell, wasp nest). FOOD: a spider web catches insects. Constructed structures have jobs too: a bridge helps people cross, a roof protects a house, a chair holds you up." },
  { id: 3, stop: "Lagoinha", pic: "arco", guide: "tintim", title: "Shape Spotter",
    remember: "<b>Triangles</b> are rigid: they keep their shape. <b>Arches</b> spread the weight to the sides and down. <b>Domes</b> are curved and spread weight around. A <b>geodesic dome</b> is a dome made of many triangles.",
    action: ["MOVE!", "Make each shape with your body before you tap: triangle (arms up, hands together), arch (hands and feet on the floor), dome (arms in a big circle)."],
    type: "pics",
    pics: [["ponte", "The pier's supports have this shape:", "triangle"], ["arco", "This old door has this shape:", "arch"], ["cupula", "This building's roof is a:", "dome"],
      ["geodesica", "Many triangles make this:", "geodesic dome"], ["jangada", "The jangada's sail is a:", "triangle"]],
    shapes: ["triangle", "arch", "dome", "geodesic dome"],
    tf: [["A dome is shaped like part of a sphere.", true], ["Doors, windows and aqueducts often use arches.", true], ["An observatory usually has an arch on top.", false],
      ["A geodesic dome is made of many squares.", false], ["A square keeps its shape better than a triangle.", false]],
    why: "ARCH = a curve that stands up, like a door or a bridge: doors, windows, bridges and aqueducts. DOME = a round roof, like half a ball: buildings, churches and observatories. Triangles are in piers, roofs, cranes and sails." },
  { id: 4, stop: "Jericoacoara", pic: "torre", guide: "sky", title: "Brace the Lifeguard Tower",
    remember: "A <b>square</b> frame can change shape when you push it. A <b>diagonal brace</b> creates triangles, so the frame becomes <b>stronger and more rigid</b>. Strong structures need good <b>materials, shape and design</b>.",
    action: ["TRY IT!", "Push the square below. Then add the brace and push again. Do the same with your pencil square from last night!"],
    type: "brace",
    gaps: [["A diagonal brace creates", "triangles", "."], ["After the brace, the frame is stronger and more", "rigid", "."], ["Strong structures need the right", "materials", ", shape and design."]],
    bank: ["triangles", "rigid", "materials", "circles", "flexible", "colors"],
    why: "The brace divides the square into two triangles. Triangles cannot change shape without changing the length of their sides, so the frame stays rigid." },
  { id: 5, stop: "Flecheiras", pic: "rede", guide: "nina", title: "Memory Match: Properties",
    remember: "A <b>material</b> is what an object is made of. A <b>property</b> describes what the material is like.",
    action: ["MOVE!", "Every time you find a pair, act out the property: STRONG (show your muscles), FLEXIBLE (bend like a coconut tree), STABLE (stand on wide feet)..."],
    type: "memory",
    mem: [["strong", "does not break easily"], ["rigid", "does not bend easily"], ["flexible", "can bend easily"], ["durable", "lasts a long time"], ["stable", "does not fall over easily"], ["water-repellent", "does not absorb water"]],
    quick: [["A metal hammer head is strong and...", ["rigid", "flexible"], "rigid"], ["Fabric (like a hammock) is...", ["flexible", "rigid"], "flexible"], ["Rubber tires are flexible, durable and have good...", ["grip", "glass"], "grip"]],
    why: "Strong = hard to break. Rigid = hard to bend. Flexible = bends easily. Durable = lasts a long time. Stable = does not fall over. Water-repellent = does not absorb water." },
  { id: 6, stop: "Taíba", pic: "martelo", guide: "tintim", title: "Talk Like a Scientist",
    remember: "Scientist's sentence: <b>___ is a good material for ___ because it is ___ and ___.</b> First think about the job, then the properties, then the material.",
    action: ["TEACH IT!", "When each sentence is ready, read it out loud to Dad like a scientist. These are great test answers!"],
    type: "build",
    sentences: [["A structure", "is a solid object", "that holds", "weight or load."], ["Metal", "is a good material", "for a hammer head", "because it is", "strong and rigid."],
      ["Rubber", "is a good material", "for bicycle tires", "because it is", "flexible and durable."], ["Roof tiles", "are good for a roof", "because they are", "strong and water-repellent."],
      ["A diagonal brace", "creates triangles", "and makes the frame", "stronger and more rigid."]],
    why: "Always give TWO properties. Metal for a hammer head: strong AND rigid. Rubber for tires: flexible AND durable (and good grip). Roof tiles: strong, durable AND water-repellent." },
];

/* ===================== STATE ===================== */
let st = { screen: "home", name: "", res: {}, a: {} };
try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = Object.assign(st, s); } catch (e) {}
if (!st.name) { try { const v1 = JSON.parse(localStorage.getItem("beach-builders-v1") || "null"); if (v1 && v1.text) { const n = Object.values(v1.text)[0]; if (n) st.name = String(n).trim(); } } catch (e) {} }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
let queue = []; try { queue = JSON.parse(localStorage.getItem(KEY + "-q") || "[]"); } catch (e) {}
const saveQ = () => { try { localStorage.setItem(KEY + "-q", JSON.stringify(queue)); } catch (e) {} };

const app = document.getElementById("app");
const el = (h) => { const t = document.createElement("template"); t.innerHTML = h.trim(); return t.content.firstChild; };
const shuffle = (arr, seed) => { const a = arr.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const A = (r) => (st.a[r.id] = st.a[r.id] || {});
function updShells() { document.getElementById("shells").textContent = `🐚 ${Object.keys(st.res).length * 10} / 60`; }

/* ===================== SCREENS ===================== */
function go(screen) { st.screen = screen; save(); render(); window.scrollTo({ top: 0, behavior: "smooth" }); }
function render() {
  updShells();
  app.innerHTML = "";
  if (st.screen === "home") return home();
  if (st.screen === "cert") return cert();
  const r = ROUNDS.find((x) => "r" + x.id === st.screen); if (r) return round(r);
  go("home");
}

function home() {
  app.appendChild(el(`<div><h1>Beach Builders 2: Ceará Coast Trip</h1><p class="sub">Science · Year 3 · Unit 2: Structures and Materials · new games, new questions!</p></div>`));
  app.appendChild(el(`<div class="team"><img src="${img("sky")}" alt="Sky"><img src="${img("tintim")}" alt="Tintim"><img src="${img("nina")}" alt="Nina" style="height:72px"><img src="${img("coqueiro")}" alt="" style="height:96px"></div>`));
  const nm = el(`<div class="card name">Engineer's name: <input id="nm" maxlength="24" autocomplete="off" placeholder="your name"></div>`);
  app.appendChild(nm);
  const inp = nm.querySelector("input"); inp.value = st.name || ""; inp.oninput = () => { st.name = inp.value; save(); };
  app.appendChild(el(`<div class="card remember">Sky, Tintim and Nina are taking a road trip along the coast of Ceará! At each beach there is a <b>new kind of game</b>. Win it to unlock the beach and get <b>10 shells</b>. Tap a beach to start.</div>`));
  const map = el(`<div class="map"></div>`);
  ROUNDS.forEach((r) => {
    const res = st.res[r.id];
    const c = el(`<div class="stop ${res ? "done" : ""}"><img src="${img(r.pic)}" alt=""><div class="n">Beach ${r.id}</div><div class="nm">${r.stop}</div><div class="st">${res ? `✔ ${res.score}/${res.total}` : r.title}</div></div>`);
    c.onclick = () => go("r" + r.id);
    map.appendChild(c);
  });
  app.appendChild(map);
  const next = ROUNDS.find((r) => !st.res[r.id]);
  const acts = el(`<div class="actions"></div>`);
  const b = el(`<button class="btn orange">${next ? (Object.keys(st.res).length ? "▶ Continue the trip" : "▶ Start the trip") : "🏆 See my certificate"}</button>`);
  b.onclick = () => go(next ? "r" + next.id : "cert");
  acts.appendChild(b); app.appendChild(acts);
}

function cert() {
  const n = (st.name || "Isabel").trim();
  app.appendChild(el(`<div class="card cert"><h1>CONGRATULATIONS, ${n.toUpperCase()}!</h1>
    <p style="font-size:19px;font-weight:700;color:#3F7A36">You finished the Ceará Coast Trip and won all 60 shells!</p>
    <div class="team"><img src="${img("sky")}"><img src="${img("tintim")}"><img src="${img("nina")}" style="height:72px"><img src="${img("castelo")}" style="height:84px"></div>
    <p style="font-size:17px">You practised: natural and constructed structures, the function of structures, strong shapes, reinforcing with a brace, properties of materials and scientist's sentences.</p>
    <p style="font-size:18px;font-weight:700;color:#2E86B0">★ Ready for the test! ★</p></div>`));
  const acts = el(`<div class="actions"></div>`); const b = el(`<button class="btn ghost">◀ Back to the map</button>`); b.onclick = () => go("home"); acts.appendChild(b); app.appendChild(acts);
}

function round(r) {
  app.appendChild(el(`<div><h2>Beach ${r.id}: ${r.stop} · ${r.title}</h2></div>`));
  app.appendChild(el(`<div class="card remember"><b>Remember:</b> ${r.remember}</div>`));
  app.appendChild(el(`<div class="card act"><img class="guide" src="${img(r.guide)}" alt=""><div><span class="tag">${r.action[0]}</span> ${r.action[1]}</div></div>`));
  const box = el(`<div class="card"></div>`); app.appendChild(box);
  const api = BUILD[r.type](r, box);
  const fb = el(`<div class="feedback"></div>`);
  const acts = el(`<div class="actions"></div>`);
  const back = el(`<button class="btn ghost">◀ Map</button>`); back.onclick = () => go("home");
  const chk = el(`<button class="btn orange">✔ Check my answers</button>`);
  const nxt = el(`<button class="btn">Next beach ▶</button>`);
  nxt.onclick = () => { const n = ROUNDS.find((x) => x.id > r.id && !st.res[x.id]) || ROUNDS.find((x) => !st.res[x.id]); go(n ? "r" + n.id : "cert"); };
  nxt.style.display = st.res[r.id] ? "" : "none";
  chk.onclick = () => {
    const a = A(r); a.tries = (a.tries || 0) + 1;
    const out = api.check(a.tries >= 2);
    st.res[r.id] = { score: out.score, total: out.total, tries: a.tries }; save(); updShells();
    const perfect = out.score === out.total;
    fb.className = "feedback show " + (perfect ? "good" : "try");
    fb.innerHTML = perfect ? `🎉 ${out.score} / ${out.total}! ${r.stop} unlocked: +10 shells!<small>Tell Dad the most important idea of this beach.</small>`
      : (a.tries >= 2 ? `⭐ ${out.score} / ${out.total}. Look at the dashed green boxes: those are the right answers. Read them out loud!<div class="why"><b>Why:</b> ${r.why}</div>`
        : `⭐ ${out.score} / ${out.total}. Good try! Read the "Remember" box again, change the red ones and check once more.<small>${r.stop} is unlocked anyway: +10 shells!</small>`);
    nxt.style.display = "";
    fb.scrollIntoView({ behavior: "smooth", block: "center" });
    send({ nome: (st.name || "Isabel").trim() || "Isabel", desafio: `V2 · Beach ${r.id} · ${r.title}`, acertos: `${out.score}/${out.total} (tentativa ${a.tries})`, respostas: out.lines.join(" | ") });
  };
  acts.append(back, chk, nxt);
  app.append(fb, acts);
}

/* ===================== GAME TYPES ===================== */
const BUILD = {
  sort(r, box) {
    const a = A(r); a.place = a.place || {};
    const order = shuffle(r.items.map((_, i) => i), 7);
    let sel = null;
    box.innerHTML = `<p style="margin:0 0 6px;font-size:16px;text-align:center">Tap a card, then tap NATURAL or CONSTRUCTED. Tap a card in a box to take it back.</p><div class="pool" id="pool"></div><div class="bins"><div class="bin nat" data-b="N"><h3>🌿 NATURAL</h3><div class="pool"></div></div><div class="bin con" data-b="C"><h3>🏗️ CONSTRUCTED</h3><div class="pool"></div></div></div>`;
    const pool = box.querySelector("#pool"), bins = [...box.querySelectorAll(".bin")];
    const chips = order.map((i) => { const c = el(`<div class="chip">${r.items[i][0]}</div>`); c.dataset.i = i; return c; });
    function lay() {
      chips.forEach((c) => { const p = a.place[c.dataset.i]; (p ? box.querySelector(`.bin[data-b="${p}"] .pool`) : pool).appendChild(c); c.classList.toggle("sel", sel === c); });
      if (!pool.children.length) pool.innerHTML = ""; bins.forEach((b) => b.classList.toggle("target", !!sel));
    }
    chips.forEach((c) => (c.onclick = (e) => { e.stopPropagation(); clear();
      const here = a.place[c.dataset.i];
      if (sel && sel !== c && here) { a.place[sel.dataset.i] = here; sel = null; save(); }
      else if (here) { delete a.place[c.dataset.i]; sel = null; save(); }
      else sel = sel === c ? null : c;
      lay(); }));
    bins.forEach((b) => (b.onclick = () => { if (!sel) return; clear(); a.place[sel.dataset.i] = b.dataset.b; sel = null; save(); lay(); }));
    const clear = () => chips.forEach((c) => c.classList.remove("ok", "bad", "reveal"));
    lay();
    return { check(reveal) {
      let score = 0; const lines = [];
      chips.forEach((c) => { const i = +c.dataset.i, p = a.place[i], ok = p === r.items[i][1]; if (ok) score++;
        c.classList.remove("ok", "bad", "reveal"); if (p) c.classList.add(ok ? "ok" : "bad"); else c.classList.add("bad");
        lines.push(`${r.items[i][0]}: ${p === "N" ? "natural" : p === "C" ? "constructed" : "(sem resposta)"} ${ok ? "✔" : "✘"}`);
        if (reveal && !ok) { c.classList.add("reveal"); c.title = r.items[i][1] === "N" ? "natural" : "constructed"; c.innerHTML = `${r.items[i][0]} → ${r.items[i][1] === "N" ? "natural" : "constructed"}`; } });
      return { score, total: r.items.length, lines };
    } };
  },

  match(r, box) {
    const a = A(r); a.pair = a.pair || {};
    const COLORS = ["#5BA84F", "#2A9D8F", "#C98A2E", "#6B4423", "#C8602A", "#2E86B0", "#EE6C4D", "#7B5AA6"];
    const right = shuffle(r.pairs.map((_, i) => i), 11);
    box.innerHTML = `<p style="margin:0 0 10px;font-size:16px">Tap a structure, then tap its function. Tap again to undo.</p><div class="match"><div class="col" id="L"></div><div class="col" id="R"></div></div>`;
    let selL = null;
    const L = r.pairs.map((p, i) => { const c = el(`<div class="chip"><span class="num"></span>${p[0]}</div>`); c.dataset.i = i; box.querySelector("#L").appendChild(c); return c; });
    const R = right.map((j) => { const c = el(`<div class="chip"><span class="num"></span>${r.pairs[j][1]}</div>`); c.dataset.j = j; box.querySelector("#R").appendChild(c); return c; });
    function paint() {
      const used = Object.values(a.pair).map(String); let k = 0;
      L.forEach((c) => { const j = a.pair[c.dataset.i]; c.classList.toggle("sel", selL === c); c.classList.toggle("paired", j !== undefined);
        if (j !== undefined) { const col = COLORS[k % 8]; k++; c.querySelector(".num").style.background = col; c.querySelector(".num").textContent = k;
          const rc = R.find((x) => x.dataset.j == j); rc.classList.add("paired"); rc.querySelector(".num").style.background = col; rc.querySelector(".num").textContent = k; } });
      R.forEach((c) => { if (!used.includes(c.dataset.j)) c.classList.remove("paired"); });
    }
    const clear = () => [...L, ...R].forEach((c) => c.classList.remove("ok", "bad", "reveal"));
    L.forEach((c) => (c.onclick = () => { clear(); if (a.pair[c.dataset.i] !== undefined) { delete a.pair[c.dataset.i]; selL = null; save(); } else selL = selL === c ? null : c; paint(); }));
    R.forEach((c) => (c.onclick = () => { clear(); const j = c.dataset.j; const owner = Object.keys(a.pair).find((k) => a.pair[k] == j);
      if (owner !== undefined && !selL) { delete a.pair[owner]; save(); paint(); return; }
      if (!selL) return; if (owner !== undefined) delete a.pair[owner]; a.pair[selL.dataset.i] = +j; selL = null; save(); paint(); }));
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      L.forEach((c) => { const i = +c.dataset.i, j = a.pair[i], ok = j === i; if (ok) score++;
        c.classList.remove("ok", "bad", "reveal"); c.classList.add(ok ? "ok" : "bad");
        const rc = R.find((x) => x.dataset.j == j); if (rc) { rc.classList.remove("ok", "bad"); rc.classList.add(ok ? "ok" : "bad"); }
        if (reveal && !ok) { c.classList.add("reveal"); c.innerHTML = `<span class="num"></span>${r.pairs[i][0]} → <i>${r.pairs[i][1]}</i>`; }
        lines.push(`${r.pairs[i][0]}: ${j !== undefined ? r.pairs[j][1] : "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.pairs.length, lines };
    } };
  },

  pics(r, box) {
    const a = A(r); a.pic = a.pic || {}; a.tf = a.tf || {};
    box.innerHTML = `<div class="pics"></div><h3 style="margin:16px 0 6px;color:#1D5F86">Lightning round: true or false?</h3><div id="tf"></div>`;
    const grid = box.querySelector(".pics"), tfb = box.querySelector("#tf");
    const groups = [];
    r.pics.forEach((p, i) => {
      const c = el(`<div class="pic"><img src="${img(p[0])}" alt=""><div class="q">${i + 1}. ${p[1]}</div><div class="opts"></div></div>`);
      const opts = r.shapes.map((s) => { const b = el(`<div class="chip">${s}</div>`); b.onclick = () => { a.pic[i] = s; save(); paint(); }; c.querySelector(".opts").appendChild(b); return b; });
      grid.appendChild(c); groups.push({ kind: "pic", i, opts, right: p[2], q: p[1] });
    });
    r.tf.forEach((t, i) => {
      const row = el(`<div class="tf"><span>${r.pics.length + i + 1}. ${t[0]}</span><span class="two"></span></div>`);
      const opts = [["True", true], ["False", false]].map(([lab, v]) => { const b = el(`<div class="chip">${lab}</div>`); b.onclick = () => { a.tf[i] = v; save(); paint(); }; row.querySelector(".two").appendChild(b); return b; });
      tfb.appendChild(row); groups.push({ kind: "tf", i, opts, right: t[1], q: t[0] });
    });
    function cur(g) { return g.kind === "pic" ? a.pic[g.i] : a.tf[g.i]; }
    function label(g, o) { return g.kind === "pic" ? r.shapes[o] : o === 0; }
    function paint() { groups.forEach((g) => g.opts.forEach((b, o) => { b.classList.remove("ok", "bad", "reveal"); b.classList.toggle("sel", cur(g) === label(g, o)); })); }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      groups.forEach((g) => { const v = cur(g), ok = v === g.right; if (ok) score++;
        g.opts.forEach((b, o) => { const val = label(g, o); b.classList.remove("ok", "bad", "reveal", "sel"); if (val === v) b.classList.add(ok ? "ok" : "bad"); if (reveal && !ok && val === g.right) b.classList.add("reveal"); });
        lines.push(`${g.q} ${v === undefined ? "(sem resposta)" : g.kind === "tf" ? (v ? "True" : "False") : v} ${ok ? "✔" : "✘"}`); });
      return { score, total: groups.length, lines };
    } };
  },

  brace(r, box) {
    const a = A(r); a.gap = a.gap || {};
    box.innerHTML = `<div class="frame"><svg viewBox="0 0 220 220"><g id="sq"><rect x="40" y="40" width="140" height="140" fill="none" stroke="#B98B62" stroke-width="14"/><line id="br" x1="46" y1="174" x2="174" y2="46" stroke="#8A5A30" stroke-width="14" opacity="0"/>
      <circle cx="40" cy="40" r="7" fill="#5C5F62"/><circle cx="180" cy="40" r="7" fill="#5C5F62"/><circle cx="40" cy="180" r="7" fill="#5C5F62"/><circle cx="180" cy="180" r="7" fill="#5C5F62"/></g>
      <path id="arrow" d="M200 110 h-26 m10 -10 l-10 10 10 10" stroke="#C8443A" stroke-width="6" fill="none" opacity="0"/></svg>
      <div style="display:flex;flex-direction:column;gap:10px"><button class="btn" id="push">👉 Push the frame</button><button class="btn ghost" id="addb">➕ Add a diagonal brace</button><div id="msg" style="font-weight:700;max-width:260px"></div></div></div>
      <h3 style="margin:16px 0 6px;color:#1D5F86">Complete the sentences: tap a word, then tap a gap.</h3><div class="tiles" id="bank"></div><div id="sent"></div>`;
    const sq = box.querySelector("#sq"), br = box.querySelector("#br"), arrow = box.querySelector("#arrow"), msg = box.querySelector("#msg");
    let braced = false;
    box.querySelector("#push").onclick = () => {
      arrow.setAttribute("opacity", 1);
      if (braced) { sq.style.transform = "translateX(-4px)"; msg.textContent = "It stays strong! The brace made two triangles: the frame is RIGID."; }
      else { sq.style.transform = "skewX(-22deg)"; msg.textContent = "Oh no! The square changed shape. A square is not rigid."; }
      setTimeout(() => { sq.style.transform = ""; arrow.setAttribute("opacity", 0); }, 1100);
    };
    box.querySelector("#addb").onclick = () => { braced = !braced; br.setAttribute("opacity", braced ? 1 : 0); box.querySelector("#addb").textContent = braced ? "➖ Remove the brace" : "➕ Add a diagonal brace"; msg.textContent = braced ? "Now push it again!" : ""; };
    let selW = null;
    const bank = box.querySelector("#bank"), sent = box.querySelector("#sent");
    const tiles = shuffle(r.bank, 5).map((w) => { const t = el(`<div class="tile">${w}</div>`); t.dataset.w = w; t.onclick = () => { selW = selW === w ? null : w; paint(); }; bank.appendChild(t); return t; });
    const gaps = r.gaps.map((g, i) => { const row = el(`<div class="sentence">${i + 1}. ${g[0]} <span class="gap"></span>${g[2]}</div>`); const gp = row.querySelector(".gap");
      gp.onclick = () => { if (selW) { Object.keys(a.gap).forEach((k) => { if (a.gap[k] === selW) delete a.gap[k]; }); a.gap[i] = selW; selW = null; } else delete a.gap[i]; save(); paint(); };
      sent.appendChild(row); return gp; });
    function paint() {
      const used = Object.values(a.gap);
      tiles.forEach((t) => { t.classList.toggle("used", used.includes(t.dataset.w)); t.style.background = selW === t.dataset.w ? "#FFF3D6" : ""; t.style.borderColor = selW === t.dataset.w ? "#E07E1E" : ""; });
      gaps.forEach((gp, i) => { gp.classList.remove("ok", "bad"); gp.textContent = a.gap[i] || "tap here"; gp.style.color = a.gap[i] ? "" : "#9ab"; gp.classList.toggle("sel", !!selW && !a.gap[i]); });
    }
    paint();
    return { check(reveal) {
      let score = 0; const lines = [];
      gaps.forEach((gp, i) => { const v = a.gap[i], ok = v === r.gaps[i][1]; if (ok) score++; gp.classList.remove("sel"); gp.classList.add(ok ? "ok" : "bad");
        if (reveal && !ok) gp.textContent = `${v || "?"} → ${r.gaps[i][1]}`;
        lines.push(`${i + 1}: ${v || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.gaps.length, lines };
    } };
  },

  memory(r, box) {
    const a = A(r); a.found = a.found || []; a.q = a.q || {}; a.moves = a.moves || 0;
    const cards = shuffle(r.mem.flatMap((p, i) => [[i, p[0], true], [i, p[1], false]]), 3);
    box.innerHTML = `<p style="margin:0 0 10px;font-size:16px">Find each property and its meaning. Turn over 2 cards at a time.</p><div class="mem"></div><p id="mv" style="text-align:center;font-weight:700;margin:10px 0 0"></p>
      <h3 style="margin:16px 0 6px;color:#1D5F86">Then answer: which property?</h3><div id="qk"></div>`;
    const grid = box.querySelector(".mem"); let up = [], lock = false;
    const els = cards.map((c, k) => { const d = el(`<div class="mcard"><span class="back">🐚</span></div>`); d.onclick = () => flip(k); grid.appendChild(d); return d; });
    function paint() {
      els.forEach((d, k) => { const [i, t, isP] = cards[k]; const done = a.found.includes(i), isUp = up.includes(k);
        d.className = "mcard" + (done ? " done" : isUp ? " up" : ""); d.innerHTML = done || isUp ? (isP ? `<span style="font-size:19px">${t.toUpperCase()}</span>` : t) : `<span class="back">🐚</span>`; });
      box.querySelector("#mv").textContent = `Pairs found: ${a.found.length} / ${r.mem.length} · turns: ${a.moves}`;
    }
    function flip(k) {
      if (lock || up.includes(k) || a.found.includes(cards[k][0])) return;
      up.push(k); paint();
      if (up.length === 2) { a.moves++; const [x, y] = up;
        if (cards[x][0] === cards[y][0]) { a.found.push(cards[x][0]); up = []; save(); setTimeout(paint, 250); }
        else { lock = true; setTimeout(() => { up = []; lock = false; paint(); }, 1100); } save(); }
    }
    const qk = box.querySelector("#qk"); const groups = [];
    r.quick.forEach((q, i) => { const row = el(`<div class="tf"><span>${i + 1}. ${q[0]}</span><span class="two"></span></div>`);
      const opts = q[1].map((o) => { const b = el(`<div class="chip">${o}</div>`); b.onclick = () => { a.q[i] = o; save(); pq(); }; row.querySelector(".two").appendChild(b); return b; });
      qk.appendChild(row); groups.push(opts); });
    function pq() { r.quick.forEach((q, i) => groups[i].forEach((b, o) => { b.classList.remove("ok", "bad", "reveal"); b.classList.toggle("sel", a.q[i] === q[1][o]); })); }
    paint(); pq();
    return { check(reveal) {
      let score = a.found.length; const lines = [`memória: ${a.found.length}/${r.mem.length} pares em ${a.moves} jogadas`];
      if (a.found.length < r.mem.length) els.forEach((d, k) => { if (!a.found.includes(cards[k][0])) d.style.outline = "3px dashed #e03131"; });
      r.quick.forEach((q, i) => { const v = a.q[i], ok = v === q[2]; if (ok) score++;
        groups[i].forEach((b, o) => { b.classList.remove("ok", "bad", "reveal", "sel"); if (q[1][o] === v) b.classList.add(ok ? "ok" : "bad"); if (reveal && !ok && q[1][o] === q[2]) b.classList.add("reveal"); });
        lines.push(`${q[0]} ${v || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.mem.length + r.quick.length, lines };
    } };
  },

  build(r, box) {
    const a = A(r); a.b = a.b || {};
    box.innerHTML = `<p style="margin:0 0 10px;font-size:16px">Tap the pieces in the right order to build each sentence. Tap a piece in the box to take it back.</p><div id="ss"></div>`;
    const ss = box.querySelector("#ss"); const parts = [];
    r.sentences.forEach((sen, i) => {
      a.b[i] = a.b[i] || [];
      const wrap = el(`<div style="margin:0 0 16px"><div style="font-weight:700;margin-bottom:6px">Sentence ${i + 1}</div><div class="build"></div><div class="tiles"></div></div>`);
      const bd = wrap.querySelector(".build"), tl = wrap.querySelector(".tiles");
      const order = shuffle(sen.map((_, k) => k), 13 + i * 7);
      const tiles = order.map((k) => { const t = el(`<div class="tile">${sen[k]}</div>`); t.onclick = () => { if (!a.b[i].includes(k)) { a.b[i].push(k); save(); paint(); } }; tl.appendChild(t); t.dataset.k = k; return t; });
      function paint() {
        bd.classList.remove("ok", "bad"); bd.innerHTML = a.b[i].length ? "" : `<span style="color:#9ab">tap the pieces below</span>`;
        a.b[i].forEach((k, pos) => { const t = el(`<div class="tile" style="border-color:#E07E1E">${sen[k]}</div>`); t.onclick = () => { a.b[i].splice(pos, 1); save(); paint(); }; bd.appendChild(t); });
        tiles.forEach((t) => t.classList.toggle("used", a.b[i].includes(+t.dataset.k)));
      }
      paint(); parts.push({ bd, paint, sen, wrap }); ss.appendChild(wrap);
    });
    return { check(reveal) {
      let score = 0; const lines = [];
      parts.forEach((p, i) => { const ok = a.b[i].length === p.sen.length && a.b[i].every((k, pos) => k === pos); if (ok) score++;
        p.bd.classList.add(ok ? "ok" : "bad");
        const old = p.wrap.querySelector(".reveal-line"); if (old) old.remove();
        if (reveal && !ok) p.wrap.appendChild(el(`<div class="reveal-line" style="margin-top:6px;color:#2f6a26;font-weight:700">✔ ${p.sen.join(" ")}</div>`));
        lines.push(`${i + 1}: ${a.b[i].map((k) => p.sen[k]).join(" ") || "(sem resposta)"} ${ok ? "✔" : "✘"}`); });
      return { score, total: r.sentences.length, lines };
    } };
  },
};

/* ===================== SEND TO DAD'S SHEET ===================== */
function send(rec) { queue.push(rec); saveQ(); flush(); }
async function flush() {
  while (queue.length) {
    const rec = queue[0]; const body = new URLSearchParams();
    Object.keys(ENTRY).forEach((k) => body.append(ENTRY[k], rec[k] || ""));
    try { await fetch(FORM, { method: "POST", mode: "no-cors", body }); queue.shift(); saveQ(); } catch (e) { break; }
  }
}
